global:
  batch_size: 32
  epochs: 50
  validation_split: 0.2
  test_split: 0.1
  random_seed: 42
  output_dir: reports/comparison
models:
  hybrid_svm_knn:
    type: sklearn
    svm_kernel: rbf
    svm_C: 1.0
    knn_neighbors: 5
    feature_processor: manual
  lstm_url:
    type: tensorflow
    embedding_dim: 128
    lstm_units: 64
    dropout: 0.3
    batch_size: 128
    feature_processor: sequential
  rnn_gru:
    type: tensorflow
    gru_units: 64
    layers: 1
    dropout: 0.4822235176166042
    batch_size: 64
    epochs: 10
    learning_rate: 0.003361590353108522
    feature_processor: rnn_gru
    embedding_dim: 256
  webphish_cnn:
    type: tensorflow
    url_vocab_size: 130
    html_vocab_size: 50000
    embedding_dim: 16
    filters: 32
    kernel_size: 8
    dropout: 0.2
    feature_processor: multimodal
  egso_cnn:
    type: tensorflow
    n_estimators: 200
    max_depth: 30
    min_samples_split: 5
    min_samples_leaf: 2
    filters:
    - 128
    - 64
    - 512
    kernel_size: 3
    dropout: 0.5723929296949042
    batch_size: 64
    epochs: 50
    learning_rate: 0.0017749915633121578
    tfidf_ngram:
    - 1
    - 2
    svd_components: 100
    feature_processor: tfidf_vae
  structural_dnn:
    type: keras
    processor: structural
    input_dim: 36
    epochs: 15
    batch_size: 128
    learning_rate: 0.001
  structural_rf:
    type: sklearn
    processor: structural
    n_estimators: 200
    max_depth: 20
    min_samples_split: 5
    random_state: 42
  url_rf:
    type: sklearn
    processor: url
    n_estimators: 100
    max_depth: 15
    random_state: 42
  structural_gb:
    type: sklearn
    processor: structural
    n_estimators: 200
    learning_rate: 0.1
    max_depth: 5
    random_state: 42
  structural_xgb:
    type: sklearn
    processor: structural
    n_estimators: 200
    learning_rate: 0.1
    max_depth: 5
    random_state: 42
  hybrid_nn:
    type: keras
    processor: hybrid
    url_vocab_size: 130
    html_vocab_size: 50000
    embedding_dim: 16
    filters: 32
    kernel_size: 8
    dropout: 0.2
    dense_units: 64
    epochs: 15
    batch_size: 64
    learning_rate: 0.001
features:
  manual:
    n_features: 48
  sequential:
    max_seq_length: 256
    vocab_size: 128
  rnn_gru:
    max_seq_length: 200
    vocab_size: 100
  multimodal:
    url_max_length: 180
    html_max_length: 2000
  tfidf_svd:
    max_features: 5000
    svd_components: 100
  hybrid:
    url_max_length: 180
    html_max_length: 2000
